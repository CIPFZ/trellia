[package]
name = "trellia"
description = "Trellia 门面 crate：re-export 与 prelude"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
trellia-assets.workspace = true
trellia-audio.workspace = true
trellia-core.workspace = true
trellia-devtools = { workspace = true, optional = true }
trellia-egui = { workspace = true, optional = true }
trellia-gfx.workspace = true
trellia-headless.workspace = true
trellia-scene.workspace = true

[features]
default = ["egui", "devtools"]
## egui 窗口后端（run_egui）
egui = ["dep:trellia-egui"]
## 调试面板（DevtoolsPlugin）
devtools = ["dep:trellia-devtools"]

[lints]
workspace = true
